services:
  # Init container — creates data directories and fixes ownership so the
  # non-root containers can write their bind-mounted paths on first run.
  # UID 322 = Lavalink container's built-in user.
  # UID 1001 = admin container's appuser (see admin/Dockerfile, keep in sync).
  init:
    image: busybox:latest
    container_name: lavalink-init
    restart: "no"
    volumes:
      - ./data:/data
      - ./config:/config
    command: >
      sh -c "mkdir -p /data/lavalink/plugins /data/lavalink/logs /data/admin &&
             chown -R 322:322 /data/lavalink &&
             chown -R 1001:1001 /data/admin /config &&
             echo 'Data directories ready'"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: ${LAVALINK_CONTAINER_NAME:-lavalink}
    restart: unless-stopped
    network_mode: "host"
    environment:
      - _JAVA_OPTIONS=${LAVALINK_JAVA_OPTS:--Xmx512M}
      - SERVER_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./config/application.yml:/opt/Lavalink/application.yml:ro
      - ./data/lavalink/plugins:/opt/Lavalink/plugins
      - ./data/lavalink/logs:/opt/Lavalink/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: $${LAVALINK_SERVER_PASSWORD:-youshallnotpass}\" http://localhost:$${SERVER_PORT:-2333}/version || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      yt-cipher:
        condition: service_started

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    network_mode: "host"
    environment:
      - API_TOKEN=${CIPHER_API_TOKEN:-change-me-cipher-token}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8001/ || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3

  bgutil-pot:
    image: jim60105/bgutil-pot
    container_name: bgutil-pot
    restart: unless-stopped
    network_mode: "host"
    command: [ "server", "--host", "0.0.0.0", "--port", "4416" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4416/ping || exit 1" ]
      interval: 60s
      timeout: 15s
      retries: 3

  # Scoped Docker API gateway — the admin only needs container list/inspect/logs/restart.
  # Exposing /var/run/docker.sock directly would let any admin-panel RCE own the host.
  # Runs on the default bridge network and publishes 2375 to 127.0.0.1 only, so
  # the API isn't reachable off-host even if the firewall rules drift.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: lavalink-dockerproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      network: host
    container_name: lavalink-admin
    restart: unless-stopped
    network_mode: "host"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-admin}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-change-me-session-secret}
      - ADMIN_PORT=${ADMIN_PORT:-8080}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-false}
      - ADMIN_TRUST_PROXY=${ADMIN_TRUST_PROXY:-false}
      - ADMIN_TRUSTED_PROXY_IPS=${ADMIN_TRUSTED_PROXY_IPS:-127.0.0.1}
      - LAVALINK_HOST=127.0.0.1
      - LAVALINK_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - CIPHER_HOST=127.0.0.1
      - CIPHER_PORT=8001
      - BGUTIL_HOST=127.0.0.1
      - BGUTIL_PORT=4416
      - POT_REFRESH_ENABLED=${POT_REFRESH_ENABLED:-true}
      - POT_REFRESH_INTERVAL_HOURS=${POT_REFRESH_INTERVAL_HOURS:-6}
      - LAVALINK_CONTAINER_NAME=${LAVALINK_CONTAINER_NAME:-lavalink}
      - CONFIG_PATH=/config/application.yml
      - STATE_PATH=/state/state.json
      - DOCKER_HOST=tcp://127.0.0.1:2375
    volumes:
      - ./config:/config
      - ./data/admin:/state
    depends_on:
      init:
        condition: service_completed_successfully
      dockerproxy:
        condition: service_healthy
      lavalink:
        condition: service_started
      yt-cipher:
        condition: service_started
      bgutil-pot:
        condition: service_started
