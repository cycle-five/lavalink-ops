# Custom HAProxy config for the Docker socket proxy.
#
# Replaces tecnativa/docker-socket-proxy's default env-var-driven config with
# explicit endpoint-level allow rules. The default config is granular at the
# resource level (CONTAINERS=1 + POST=1), which is enough to also pass
# POST /containers/create + start — meaning an attacker with admin RCE could
# create a privileged container, bind-mount /, and escape to host root.
#
# This config only allows the specific endpoint+method combinations the
# admin panel actually needs:
#
#   GET  /_ping                       liveness, used by admin's healthcheck
#   GET  /version                     docker-py from_env() API negotiation
#   GET  /containers/{name}/json      inspect (containers.get)
#   GET  /containers/{id}/logs        log fetch + follow stream
#   POST /containers/{id}/restart     config-change + PoToken refresh
#
# Everything else (create, start, kill, exec, prune, images, volumes, swarm,
# networks, etc) returns 403.

global
    log stdout format raw local0
    pidfile /var/run/haproxy.pid

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    log global
    option httplog

frontend dockerproxy
    bind :2375

    # Method ACLs
    acl IS_GET  method GET
    acl IS_POST method POST

    # Path ACLs — match optional /vX.Y/ Docker API version prefix.
    # Container-name regex restricts the {id} segment to characters Docker
    # actually permits (alphanumerics, _, ., -), preventing path-traversal
    # tricks via URL encoding.
    acl PATH_PING    path -i /_ping
    acl PATH_VERSION path_reg -i ^(/v[0-9.]+)?/version$
    acl PATH_INSPECT path_reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$
    acl PATH_LOGS    path_reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs$
    acl PATH_RESTART path_reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/restart$

    # Allow the specific endpoint + method combinations admin needs.
    http-request allow if IS_GET  PATH_PING
    http-request allow if IS_GET  PATH_VERSION
    http-request allow if IS_GET  PATH_INSPECT
    http-request allow if IS_GET  PATH_LOGS
    http-request allow if IS_POST PATH_RESTART

    # Deny everything else with 403.
    http-request deny

    default_backend docker_backend

backend docker_backend
    mode http
    server dockersocket unix@/var/run/docker.sock
