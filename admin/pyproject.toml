[project]
name = "lavalink-admin"
version = "0.2.0"
description = "Admin panel for Lavalink audio node management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "ruamel.yaml>=0.18.0",
  "docker>=7.0.0",
  "apscheduler>=3.10.0",
  "pydantic-settings>=2.5.0",
  "starlette>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0",
  "httpx",                  # for TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio: pin the fixture loop scope explicitly — leaving it unset
# is deprecated and warns on every run.
asyncio_default_fixture_loop_scope = "function"
